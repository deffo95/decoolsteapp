<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <title>De Coolste App</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="manifest" href="./manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="De Coolste App">
  <link rel="apple-touch-icon" href="./icon-192.png">

  <style>
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: #111;
      color: white;
    }
    .hero {
      padding: 40px 24px;
      background: linear-gradient(135deg, #ff4d4d, #ff7b00);
      border-bottom-left-radius: 40px;
      border-bottom-right-radius: 40px;
    }
    .hero h1 {
      margin: 0;
      font-size: 36px;
      font-weight: 800;
    }
    .hero p {
      opacity: 0.9;
      margin-top: 8px;
    }
    .block {
      margin: 24px;
      padding: 24px;
      background: #1c1c1c;
      border-radius: 20px;
    }
    .block h2 {
      margin-top: 0;
      font-size: 24px;
      font-weight: 700;
    }
    .nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #1c1c1c;
      display: flex;
      justify-content: space-around;
      padding: 14px 0;
      border-top: 1px solid #333;
    }
    .nav a {
      color: white;
      text-decoration: none;
      font-size: 22px;
    }
  </style>
</head>

<body>
  <div class="hero">
    <h1>De Coolste App</h1>
    <p>Alles voor de vriendengroep</p>
  </div>

  <div class="block">
    <h2>Volgende activiteit</h2>
    <div id="next-title">Laden...</div>
    <div id="next-date"></div>
    <div id="next-location"></div>
  </div>

  <div class="block">
    <h2>📅 Agenda</h2>
    <a href="./agenda.html" style="color:#ff7b00;">Bekijk agenda</a>
  </div>

  <div class="block">
    <h2>🎲 Games</h2>
    <a href="./games.html" style="color:#ff7b00;">Open games</a>
  </div>

  <div class="block">
    <h2>🍳 Kookboek</h2>
    <a href="./kookboek.html" style="color:#ff7b00;">Open kookboek</a>
  </div>

  <div class="nav">
    <a href="./index.html">🏠</a>
    <a href="./agenda.html">📅</a>
    <a href="./kookboek.html">🍳</a>
  </div>

  <script src="./next-event.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./service-worker.js");
    }
  </script>
</body>
</html>
