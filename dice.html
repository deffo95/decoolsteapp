<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <title>Dobbelstenen – De Coolste App</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="manifest" href="./manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="De Coolste App">
  <link rel="apple-touch-icon" href="./icon-192.png">

  <meta name="theme-color" content="#0b0c12">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap">
  <link rel="stylesheet" href="./style.css">
</head>

<body>

  <div class="board-wrapper">
    <div class="board">

      <div class="header-row">
        <div class="mascot">
          <img src="./maskotte.png" alt="Maskotte">
        </div>
        <h1 class="app-title">De Coolste App</h1>
      </div>

      <h1 class="page-title">🎲 Dobbelstenen</h1>

      <section class="dice-panel">
        <div class="dice-stage">
          <div class="dice-tray" id="dice-tray" aria-live="polite"></div>
          <div class="dice-total" id="dice-total" aria-live="polite"></div>
        </div>

        <button type="button" class="roll-button" id="roll-button">🎲 Gooien</button>

        <div class="dice-controls">
          <div class="dice-stepper" role="group" aria-label="Aantal dobbelstenen">
            <button type="button" id="dice-minus" aria-label="Eén dobbelsteen minder">−</button>
            <span><strong id="dice-count">2</strong> stenen</span>
            <button type="button" id="dice-plus" aria-label="Eén dobbelsteen meer">+</button>
          </div>
          <button type="button" class="ghost-button" id="shake-button" aria-pressed="false" hidden>📳 Schudden om te gooien</button>
        </div>

        <p class="dice-tip">Tip: tik op een steen om hem vast te houden bij de volgende worp.</p>

        <div class="dice-history" hidden>
          <div class="section-label">Laatste worpen</div>
          <ol id="dice-history"></ol>
        </div>
      </section>

    </div>
  </div>

  <nav class="bottom-nav">
    <a href="./index.html" class="nav-cap" data-label="Home">🏠</a>
    <a href="./agenda.html" class="nav-cap" data-label="Agenda">📅</a>
    <div class="nav-cap" id="nav-menu" data-label="Menu" role="button" tabindex="0">☰</div>
  </nav>

  <div id="menu-overlay" class="menu-overlay">
    <div class="menu-box">
      <h3>Menu</h3>
      <a href="./index.html">🏠 Home</a>
      <a href="./games.html">🎮 Games</a>
      <a href="./agenda.html">📅 Agenda</a>
      <button id="menu-close">Sluiten</button>
    </div>
  </div>

  <script>
    const menuBtn = document.getElementById("nav-menu");
    const menuOverlay = document.getElementById("menu-overlay");
    const menuClose = document.getElementById("menu-close");
    const menuBox = document.querySelector(".menu-box");

    menuBtn.addEventListener("click", () => {
      menuOverlay.style.display = "flex";
      requestAnimationFrame(() => requestAnimationFrame(() => menuBox.classList.add("slide-in")));
    });

    menuClose.addEventListener("click", () => {
      menuBox.classList.remove("slide-in");
      setTimeout(() => menuOverlay.style.display = "none", 200);
    });

    menuOverlay.addEventListener("click", (e) => {
      if (e.target === menuOverlay) {
        menuBox.classList.remove("slide-in");
        setTimeout(() => menuOverlay.style.display = "none", 200);
      }
    });
  </script>

  <script src="./dice.js"></script>
</body>
</html>
