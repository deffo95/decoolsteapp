<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <title>De Coolste App</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link rel="manifest" href="./manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="De Coolste App">
  <link rel="apple-touch-icon" href="./icon-192.png">

  <link rel="stylesheet" href="./style.css">
</head>

<body>
  <div class="board-wrapper">
    <div class="board">

      <!-- Header zonder icoontjes en zonder tekst -->
      <div class="header-row">
        <div class="mascot">
          <img src="./maskotte.png" alt="Maskotte">
        </div>
      </div>

      <!-- Agenda kaart -->
      <section class="agenda-card">
        <div class="agenda-card-title">Komende activiteit</div>

        <h2 id="next-title">Laden...</h2>

        <div class="agenda-line">
          <span class="icon">📅</span>
          <span id="next-date">Even geduld...</span>
        </div>

        <div class="agenda-line">
          <span class="icon">📍</span>
          <span id="next-location">Even geduld...</span>
        </div>

        <a href="./agenda.html">
          <button>Bekijk agenda</button>
        </a>
      </section>

      <!-- Kaarten -->
      <section class="stacks">
        <a href="./games.html" class="stack-card stack-games">
          <div class="stack-card-title">Games</div>
          <div class="stack-card-icon">🎲</div>
        </a>

        <a href="./agenda.html" class="stack-card stack-agenda">
          <div class="stack-card-title">Agenda</div>
          <div class="stack-card-icon">📆</div>
        </a>
      </section>

    </div>
  </div>

  <nav class="bottom-nav">
    <div class="nav-cap active">
      <span>🏠</span>
      <div class="nav-label">Home</div>
    </div>
    <a href="./agenda.html" class="nav-cap">
      <span>📅</span>
      <div class="nav-label">Agenda</div>
    </a>
    <div class="nav-cap">
      <span>☰</span>
      <div class="nav-label">Menu</div>
    </div>
  </nav>

  <script src="./next-event.js"></script>

  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./service-worker.js");
    }
  </script>
</body>
</html>
