<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <title>Vriendengroep – Bordspel Home</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="board-wrapper">
    <div class="board">

      <!-- Tegels -->
      <div class="tiles">
        <div class="tile orange">🔥</div>
        <div class="tile green">▲</div>
        <div class="tile red">❤</div>
        <div class="tile blue">🌀</div>
      </div>

      <!-- Header -->
      <div class="header-row">
        <div class="mascot">
          <img src="maskotte.png" alt="Maskotte">
        </div>
        <div class="header-text">
          <h1>Hallo vrienden!</h1>
          <p>Welkom in onze bordspel‑homepage</p>
        </div>
      </div>

      <!-- Agenda kaart -->
      <section class="agenda-card">
        <div class="agenda-card-title">Komend agendapunt</div>
        <h2 id="next-title">Laden...</h2>

        <div class="agenda-line">
          <span class="icon">📅</span>
          <span id="next-date">Even geduld...</span>
        </div>

        <div class="agenda-line">
          <span class="icon">📍</span>
          <span id="next-location">Even geduld...</span>
        </div>

        <a href="agenda.html">
          <button>Bekijk agenda</button>
        </a>
      </section>

      <!-- Kaarten -->
      <section class="stacks">
        <a href="games.html" class="stack-card stack-games">
          <div class="stack-card-title">Games</div>
          <div class="stack-card-icon">🎲</div>
        </a>

        <a href="kookboek.html" class="stack-card stack-kookboek">
          <div class="stack-card-title">Kookboek</div>
          <div class="stack-card-icon">🍳</div>
        </a>

        <a href="agenda.html" class="stack-card stack-agenda">
          <div class="stack-card-title">Agenda</div>
          <div class="stack-card-icon">📆</div>
        </a>
      </section>

    </div>
  </div>

  <!-- Bottom nav -->
  <nav class="bottom-nav">
    <div class="nav-cap active">
      <span>🏠</span>
      <div class="nav-label">Home</div>
    </div>
    <a href="agenda.html" class="nav-cap">
      <span>📅</span>
      <div class="nav-label">Agenda</div>
    </a>
    <div class="nav-cap">
      <span>☰</span>
      <div class="nav-label">Menu</div>
    </div>
  </nav>

  <script src="next-event.js"></script>
</body>
</html>
