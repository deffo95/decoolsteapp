<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <title>Agenda – De Coolste App</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="manifest" href="./manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="De Coolste App">
  <link rel="apple-touch-icon" href="./icon-192.png">

  <meta name="theme-color" content="#0b0c12">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap">
  <link rel="stylesheet" href="./style.css">
</head>

<body>
  <div class="board-wrapper">
    <div class="board">

      <div class="header-row">
        <div class="mascot">
          <img src="./maskotte.png" alt="Maskotte">
        </div>
        <h1 class="app-title">De Coolste App</h1>
      </div>

      <h1 class="page-title">📅 Agenda</h1>
      <section class="agenda-card notify-card" id="notify-card" hidden>
        <div class="notify-head">
          <div>
            <div class="agenda-card-title">🔔 Meldingen</div>
            <div class="notify-status" id="notify-status">Krijg een melding op de dag van een activiteit.</div>
          </div>
          <label class="switch">
            <input type="checkbox" id="notify-toggle" aria-label="Meldingen aan of uit">
            <span class="switch-track"></span>
          </label>
        </div>
        <div class="notify-time-row" id="notify-time-row" hidden>
          <label for="notify-time">Tijdstip</label>
          <input type="time" id="notify-time" value="09:00">
          <button type="button" id="notify-test" class="ghost-button">Test</button>
        </div>
        <p class="notify-hint" id="notify-hint" hidden></p>
      </section>

      <div id="agenda-list">Agenda wordt geladen...</div>

    </div>
  </div>

  <nav class="bottom-nav">
    <a href="./index.html" class="nav-cap" data-label="Home">🏠</a>
    <a href="./agenda.html" class="nav-cap" data-label="Agenda" aria-current="page">📅</a>
    <div class="nav-cap" id="nav-menu" data-label="Menu" role="button" tabindex="0">☰</div>
  </nav>

  <div id="menu-overlay" class="menu-overlay">
    <div class="menu-box">
      <h3>Menu</h3>
      <a href="./index.html">🏠 Home</a>
      <a href="./games.html">🎲 Games</a>
      <a href="./agenda.html">📅 Agenda</a>
      <a href="https://radiobm.decoolstejongens.nl" target="_blank" rel="noopener">📻 RadioBM <span class="menu-external" aria-hidden="true">↗</span></a>
      <button id="menu-close">Sluiten</button>
    </div>
  </div>

  <script src="./calendar.js"></script>
  <script src="./agenda-script.js"></script>
  <script src="./notifications.js"></script>

  <script>
    const menuBtn = document.getElementById("nav-menu");
    const menuOverlay = document.getElementById("menu-overlay");
    const menuClose = document.getElementById("menu-close");
    const menuBox = document.querySelector(".menu-box");

    menuBtn.addEventListener("click", () => {
      menuOverlay.style.display = "flex";
      requestAnimationFrame(() => requestAnimationFrame(() => menuBox.classList.add("slide-in")));
    });

    menuClose.addEventListener("click", () => {
      menuBox.classList.remove("slide-in");
      setTimeout(() => menuOverlay.style.display = "none", 200);
    });

    menuOverlay.addEventListener("click", (e) => {
      if (e.target === menuOverlay) {
        menuBox.classList.remove("slide-in");
        setTimeout(() => menuOverlay.style.display = "none", 200);
      }
    });
  </script>

  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./service-worker.js");
    }
  </script>

</body>
</html>
