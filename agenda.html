<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <title>Agenda – De Coolste App</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- PWA manifest -->
  <link rel="manifest" href="./manifest.json">

  <!-- iOS PWA support -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="De Coolste App">
  <link rel="apple-touch-icon" href="./icon-192.png">

  <link rel="stylesheet" href="./style.css">
</head>

<body>
  <div class="board-wrapper">
    <div class="board">

      <h1 style="margin-bottom: 16px;">📅 Agenda</h1>

      <div id="agenda-list">Agenda wordt geladen...</div>

    </div>
  </div>

  <nav class="bottom-nav">
    <a href="./index.html" class="nav-cap">
      <span>🏠</span>
      <div class="nav-label">Home</div>
    </a>
    <div class="nav-cap active">
      <span>📅</span>
      <div class="nav-label">Agenda</div>
    </div>
    <div class="nav-cap">
      <span>☰</span>
      <div class="nav-label">Menu</div>
    </div>
  </nav>

  <script>
    // Jouw Cloudflare Worker URL
    const PROXY_URL = "https://winter-rice-f921.kthnmj5r86.workers.dev";

    async function loadICS() {
      try {
        const res = await fetch(PROXY_URL);

        if (!res.ok) {
          document.getElementById("agenda-list").innerHTML =
            "Kon agenda niet laden (proxy-fout).";
          return;
        }

        const text = await res.text();
        const events = parseICS(text);

        // Alleen toekomstige events
        const now = new Date();
        const upcoming = events.filter(ev => ev.start > now);

        if (upcoming.length === 0) {
          document.getElementById("agenda-list").innerHTML =
            "Geen aankomende activiteiten.";
          return;
        }

        renderAgenda(upcoming);

      } catch (err) {
        document.getElementById("agenda-list").innerHTML =
          "Kon agenda niet laden (netwerkfout).";
      }
    }

    function parseICS(text) {
      const lines = text.split("\n");
      const events = [];
      let event = null;

      for (let line of lines) {
        if (line.startsWith("BEGIN:VEVENT")) event = {};

        if (line.startsWith("SUMMARY:"))
          event.summary = line.replace("SUMMARY:", "").trim();

        if (line.startsWith("DTSTART"))
          event.start = parseICSDate(line);

        if (line.startsWith("DTEND"))
          event.end = parseICSDate(line);

        if (line.startsWith("LOCATION:"))
          event.location = line.replace("LOCATION:", "").trim();

        if (line.startsWith("END:VEVENT"))
          events.push(event);
      }

      return events;
    }

    function parseICSDate(line) {
      const raw = line.split(":")[1].trim();

      // Formaat 1: 20250215T130000Z (UTC)
      if (raw.endsWith("Z")) {
        return new Date(raw);
      }

      // Formaat 2: 20250215T130000 (lokale tijd)
      if (raw.includes("T")) {
        const y = raw.substring(0, 4);
        const m = raw.substring(4, 6);
        const d = raw.substring(6, 8);
        const h = raw.substring(9, 11);
        const min = raw.substring(11, 13);
        return new Date(`${y}-${m}-${d}T${h}:${min}`);
      }

      // Formaat 3: 20250215 (hele dag)
      if (raw.length === 8) {
        const y = raw.substring(0, 4);
        const m = raw.substring(4, 6);
        const d = raw.substring(6, 8);
        return new Date(`${y}-${m}-${d}T00:00`);
      }

      return new Date();
    }

    function renderAgenda(events) {
      const container = document.getElementById("agenda-list");
      container.innerHTML = "";

      events.sort((a, b) => a.start - b.start);

      events.forEach(ev => {
        const div = document.createElement("div");
        div.className = "agenda-card";

        div.innerHTML = `
          <div class="agenda-card-title">${ev.summary}</div>

          <div class="agenda-line">
            <span class="icon">📅</span>
            ${ev.start.toLocaleDateString("nl-NL")}
            ${ev.start.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}
          </div>

          <div class="agenda-line">
            <span class="icon">📍</span>
            ${ev.location || "Onbekende locatie"}
          </div>
        `;

        container.appendChild(div);
      });
    }

    loadICS();
  </script>

  <!-- Service worker registratie -->
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./service-worker.js");
    }
  </script>

</body>
</html>
