<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <title>De Coolste App</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

  <link rel="manifest" href="./manifest.json">

  <!-- PWA & Apple Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="De Coolste App">
  <link rel="apple-touch-icon" href="./icon-192.png">

  <!-- Google Fonts for modern typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="./style.css">
</head>

<body>
  <div class="app-container">
    <main class="board">

      <!-- Decoratieve accent-tags -->
      <div class="tile-bar">
        <span class="tile tile-orange" aria-hidden="true">🔥</span>
        <span class="tile tile-green" aria-hidden="true">▲</span>
        <span class="tile tile-red" aria-hidden="true">❤️</span>
        <span class="tile tile-blue" aria-hidden="true">🌀</span>
      </div>

      <!-- Header met MASCCOT & Welkom -->
      <header class="header-card">
        <div class="mascot-avatar">
          <img src="./maskotte.png" alt="Maskotte">
        </div>
        <div class="header-text">
          <h1>Hallo vrienden! 👋</h1>
          <p>Welkom in De Coolste App</p>
        </div>
      </header>

      <!-- Agenda Highlight Card -->
      <section class="agenda-card">
        <div class="card-badge">Eerstvolgende activiteit</div>

        <h2 id="next-title" class="agenda-title">Laden...</h2>

        <div class="agenda-meta">
          <div class="meta-item">
            <span class="meta-icon">📅</span>
            <span id="next-date">Even geduld...</span>
          </div>
          <div class="meta-item">
            <span class="meta-icon">📍</span>
            <span id="next-location">Even geduld...</span>
          </div>
        </div>

        <a href="./agenda.html" class="btn btn-primary">
          <span>Bekijk volledige agenda</span>
          <span class="btn-arrow">→</span>
        </a>
      </section>

      <!-- Quick Access Stacks / Snelkoppelingen -->
      <section class="stacks-grid">
        <a href="./games.html" class="stack-card stack-games">
          <div class="stack-icon">🎲</div>
          <div class="stack-info">
            <span class="stack-title">Games</span>
            <span class="stack-subtitle">Spelen & plezier</span>
          </div>
        </a>

        <a href="./kookboek.html" class="stack-card stack-kookboek">
          <div class="stack-icon">🍳</div>
          <div class="stack-info">
            <span class="stack-title">Kookboek</span>
            <span class="stack-subtitle">Lekkere recepten</span>
          </div>
        </a>

        <a href="./agenda.html" class="stack-card stack-agenda">
          <div class="stack-icon">📆</div>
          <div class="stack-info">
            <span class="stack-title">Agenda</span>
            <span class="stack-subtitle">Alle planningen</span>
          </div>
        </a>
      </section>

    </main>

    <!-- Floating Bottom Navigation -->
    <nav class="bottom-nav">
      <a href="#" class="nav-item active">
        <span class="nav-icon">🏠</span>
        <span class="nav-label">Home</span>
      </a>
      <a href="./agenda.html" class="nav-item">
        <span class="nav-icon">📅</span>
        <span class="nav-label">Agenda</span>
      </a>
      <a href="./menu.html" class="nav-item">
        <span class="nav-icon">☰</span>
        <span class="nav-label">Menu</span>
      </a>
    </nav>
  </div>

  <script src="./next-event.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./service-worker.js");
    }
  </script>
</body>
</html>
